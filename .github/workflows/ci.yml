# Unit tests, lint and the investigator's tests on every push and pull request (Wai,
# 2026-11-18). The end-to-end tests stay part of every release (`npm run release`).
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned by commit: checkout v7.0.1, setup-node v7.1.0.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          # 22.13 or newer: the investigator uses node:sqlite.
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run lint
      - run: npm test
        working-directory: research/investigator
