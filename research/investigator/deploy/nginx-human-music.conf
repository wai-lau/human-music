# nginx pieces for the Human Music investigator. Only two paths reach the
# service; everything else under /human-music/ is not proxied.

# Belongs in the http block (for example a file in conf.d), NOT inside a
# server block. A modest limit per client address: 30 requests a minute.
limit_req_zone $binary_remote_addr zone=human_music:1m rate=30r/m;

# The next two location blocks go inside the existing server block for the
# site, before its catch-all location.

# Token-gated routes: investigate, status, recheck.
location /human-music/api/ {
    # The service itself refuses bodies over 64 KB; stop them here first.
    client_max_body_size 64k;
    limit_req zone=human_music burst=10 nodelay;
    limit_req_status 429;
    # The trailing slash on proxy_pass drops the /human-music prefix.
    proxy_pass http://127.0.0.1:8140/api/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}

# Token-gated detail for one artist.
location /human-music/verdicts/ {
    client_max_body_size 64k;
    limit_req zone=human_music burst=10 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8140/verdicts/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}
